name: main CI/CD

on: 
  push: 
    branches:
      - "main"

jobs: 
  lint_and_test: 
    runs-on: Ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: load dependency
        uses: pip install -r server/requirements.txt

      - name: run linter
        run: ruff check .