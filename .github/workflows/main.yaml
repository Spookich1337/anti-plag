name: main CI/CD

on: 
  push: 
    branches:
      - "main"

jobs: 
  lint_and_test: 
    runs-on: Ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: load dependency
        run: pip install -r server/requirements.txt

      - name: run linter
        run: ruff check .

      - name: run tests
        run:  pytest server/tests/ -v

  build:
    runs-on: Ubuntu-24.04
    needs: lint_and_test
    if: github.event_name=='push'
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login
        uses: docker/login-action@v2
        with: 
          username: ${{secrets.DOCKERHUB_LOGIN}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: setup builder
        uses: docker/setup-buildx-action@v2
      
      - name: build and push
        uses: docker/build-push-action@v4
        with: 
          context: .
          file: ./Dockerfile
          push: True
          tags: |
            ${{secrets.DOCKERHUB_LOGIN}}/anti-plag:latest
            ${{secrets.DOCKERHUB_LOGIN}}/anti-plag:${{github.sha}}