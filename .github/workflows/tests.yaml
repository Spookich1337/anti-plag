name: tests

on:
  pull_request:
    branches: 
      - "develop"

jobs:
  test:
    runs-on: Ubuntu-24.04

    steps:  
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install requirements
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest server/tests/ -v
