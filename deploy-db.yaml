apiVersion: apps/v1
kind: Deployment
metadata:
  name: moevm-anti-plag-db
spec:
  selector:
    matchLabels:
      app: moevm-anti-plag-db
  template:
    metadata:
      labels:
        app: moevm-anti-plag-db
    spec:
      containers:
      - name: moevm-anti-plag-db
        image: neo4j:5.12
        imagePullPolicy: Always
        env:
        - name: NEO4J_AUTH
          value: "neo4j/password123"
        resources:
          requests:
            memory: "512Mi"
            cpu: "0.5"
          limits:
            memory: "1Gi"
            cpu: "1"
        ports:
        - containerPort: 7687

        startupProbe:
          httpGet:
            path: /
            port: 7687
          failureTreshold: 30
          periodSeconds: 5
        
        livlinessProbe:
          tcpSocket:
            port: 7687
          inititalDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: moevm-anti-plag-db-service
spec:
  selector:
    app: moevm-anti-plag-db
  ports:
  - protocol: TCP
    name: bolt
    port: 7687
    targetPort: 7687
  type: ClusterIP
